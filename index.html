  --oth:#f0eef8; --oth-i:#5b4bb0;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 48px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:18px 0 12px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
h1 span{color:var(--muted);font-weight:600}
.nav{display:flex;align-items:center;gap:8px;margin-top:12px}
.nav button{font:inherit;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;height:38px;padding:0 12px;cursor:pointer}
.nav button:hover{border-color:var(--muted)}
.nav button:disabled{opacity:.35;cursor:default}
.nav .arrow{width:38px;padding:0;font-size:18px}
.range{flex:1;text-align:center;font-weight:700;font-size:15px}
.today-btn{color:var(--accent)!important}
.day{margin-top:22px}
.day-h{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.day-h .d{font-size:17px;font-weight:800;text-transform:capitalize}
.day-h .w{color:var(--muted);font-size:14px;font-weight:600}
.day.is-today .day-h .d{color:var(--today)}
.badge-today{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--today);color:#fff;border-radius:6px;padding:2px 7px}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.day.is-today .list{border-color:var(--today)}
.les{display:grid;grid-template-columns:62px 38px 1fr;gap:12px;padding:13px 14px;border-top:1px solid var(--line)}
.les:first-child{border-top:0}
.time{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;line-height:1.25}
.time small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.subj{font-weight:700;font-size:15px;line-height:1.3}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:6px}
.type{font-size:12px;font-weight:700;border-radius:6px;padding:3px 8px;white-space:nowrap}
.t-lec{background:var(--lec);color:var(--lec-i)}
.t-sem{background:var(--sem);color:var(--sem-i)}
.t-pr{background:var(--pr);color:var(--pr-i)}
.t-ex{background:var(--ex);color:var(--ex-i)}
.t-oth{background:var(--oth);color:var(--oth-i)}
.teacher{color:var(--muted);font-size:13.5px;font-weight:500}
.empty{color:var(--muted);font-size:14px;padding:14px;background:transparent;border:1px dashed var(--line);border-radius:14px}
.past .list,.past .empty{opacity:.55}
.has-topic{cursor:pointer;position:relative;transition:background .15s}
.has-topic:hover{background:color-mix(in srgb,var(--line) 35%,transparent)}
.has-topic .subj{padding-right:22px}
.has-topic::after{content:"";position:absolute;right:16px;top:19px;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
.has-topic.open::after{transform:rotate(-135deg);top:23px}
.topic{display:none;margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:14px;line-height:1.45;font-weight:500}
.open .topic{display:block}
.has-topic:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ico{width:38px;height:38px;border-radius:10px;background:var(--bg);color:var(--ink);display:grid;place-items:center}
.ico svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.top{flex-wrap:wrap;row-gap:10px;align-items:center}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{font:inherit;font-weight:700;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;height:34px;padding:0 11px;cursor:pointer;display:inline-flex;align-items:center}
.tool:hover{border-color:var(--muted)}
.tool.icon-only{width:34px;padding:0;justify-content:center}
.tool svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,12,18,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 12px 12px}
.modal[hidden]{display:none}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:600px;max-height:88vh;border-radius:16px;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
.m-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.m-head h2{flex:1;font-size:17px;font-weight:800;line-height:1.25}
.m-close{font:inherit;font-size:24px;line-height:1;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.m-body{overflow:auto;padding:6px 18px 18px}
.m-sec{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.person{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.av{width:64px;height:80px;border-radius:10px;object-fit:cover;object-position:center 15%;background:var(--bg)}
.person.head{grid-template-columns:84px 1fr}
.person.head .av{width:84px;height:104px}
.m-sec+.person{border-top:0}
.person .nm{font-weight:800;font-size:15.5px}
.person .ps{color:var(--ink);font-size:14px;margin-top:2px;line-height:1.35}
.person .rk{color:var(--muted);font-size:13px;margin-top:2px}
.person.head .nm{font-size:17px}
.s-input{width:100%;font:inherit;font-size:16px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-top:12px;outline:none}
.s-input:focus{border-color:var(--accent)}
.s-hint{color:var(--muted);font-size:13px;margin:10px 2px 4px}
.s-res{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;border-top:1px solid var(--line);padding:11px 2px;cursor:pointer}
.s-res:hover{background:color-mix(in srgb,var(--line) 35%,transparent)}
.s-res .sd{font-size:12.5px;color:var(--muted);font-weight:700}

.ex-item.soon .ex-day{border-color:var(--ex-i)}

const modal=document.getElementById("modal"),mTitle=document.getElementById("mTitle"),mBody=document.getElementById("mBody");
let lastFocus=null;
function openModal(title){lastFocus=document.activeElement;mTitle.textContent=title;mBody.innerHTML="";modal.hidden=false;document.body.style.overflow="hidden"}
function closeModal(){modal.hidden=true;document.body.style.overflow="";if(lastFocus)try{lastFocus.focus()}catch(e){}}
document.getElementById("mClose").onclick=closeModal;
modal.addEventListener("click",e=>{if(e.target===modal)closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!modal.hidden)closeModal()},true);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.querySelectorAll("[data-lead]").forEach(b=>b.onclick=()=>{const L=LEAD[b.dataset.lead];openModal(L.title);let html="";
  L.sections.forEach(([sec,ps])=>{if(sec)html+='<div class="m-sec">'+esc(sec)+"</div>";else html+='<div class="m-sec" style="margin-top:8px"></div>';
    ps.forEach(p=>{html+='<div class="person'+(p[3]?" head":"")+'"><img class="av" src="'+p[4]+'" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'"><div><div class="nm">'+esc(p[0])+'</div><div class="ps">'+esc(p[1])+'</div><div class="rk">'+esc(p[2])+"</div></div></div>"})});
  mBody.innerHTML=html;document.getElementById("mClose").focus()});
const ALL=RAW.split(";").map((r,i)=>{const[d,t,s,p,te]=r.split("|");return{d,t,s:+s,p:+p,te:+te,topic:fmtTopic(TP[TI[i]])}});
const norm=s=>s.toLowerCase().replace(/ё/g,"е");
function hl(text,q){const n=norm(text);let out="",i=0;if(!q)return esc(text);let j;while((j=n.indexOf(q,i))>=0){out+=esc(text.slice(i,j))+"<mark>"+esc(text.slice(j,j+q.length))+"</mark>";i=j+q.length}return out+esc(text.slice(i))}
function dateOf(d){const[dd,mm]=d.split(".");return new Date(YEAR,+mm-1,+dd)}
document.getElementById("searchBtn").onclick=()=>{openModal("Поиск по расписанию");
  mBody.innerHTML='<input class="s-input" id="sIn" type="search" placeholder="Предмет, преподаватель, тема, тип…" autocomplete="off"><div id="sOut"></div>';
  const inp=document.getElementById("sIn"),out=document.getElementById("sOut");
  const run=()=>{const q=norm(inp.value.trim());if(q.length<2){out.innerHTML='<div class="s-hint">Например: «Мельник», «зачёт», «Смутное время», «семинар»</div>';return}
    const words=q.split(/\s+/);
    const res=ALL.filter(x=>{const hay=norm([S[x.s],P[x.p],T[x.te],x.topic].join(" "));return words.every(w=>hay.includes(w))});
    if(!res.length){out.innerHTML='<div class="s-hint">Ничего не найдено</div>';return}
    const upcoming=res.filter(x=>dateOf(x.d)>=todayMid).length;
    let html='<div class="s-hint">Найдено: '+res.length+(upcoming?" · впереди: "+upcoming:"")+"</div>";
    res.slice(0,150).forEach((x,i)=>{const dt=dateOf(x.d);
      html+='<button class="s-res" data-i="'+ALL.indexOf(x)+'"><div class="sd">'+dt.getDate()+" "+MON[dt.getMonth()]+", "+DOW[dt.getDay()]+" · "+x.t+'</div><div class="ss">'+hl(S[x.s],words[0])+'</div><div class="sm"><span class="type '+PC[x.p]+'">'+esc(P[x.p])+'</span><span class="teacher">'+hl(T[x.te],words[0])+"</span></div>"+(x.topic?'<div class="st">'+hl(x.topic,words[0])+"</div>":"")+"</button>"});
    if(res.length>150)html+='<div class="s-hint">Показаны первые 150 — уточните запрос</div>';
    out.innerHTML=html;
    out.querySelectorAll(".s-res").forEach(b=>b.onclick=()=>{const x=ALL[+b.dataset.i];closeModal();cur=monday(dateOf(x.d));setHash();render(false);
      const el=document.querySelector('[data-k="'+x.d+"|"+x.t+'"]');if(el){if(el.classList.contains("has-topic")&&!el.classList.contains("open"))el.click();
        setTimeout(()=>{window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-document.querySelector("header").offsetHeight-16,behavior:"smooth"});el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash")},30)}})};
  inp.addEventListener("input",run);run();setTimeout(()=>inp.focus(),30)};

const EXAM_TYPES=[4,5,6,7,9,8];
function jumpTo(x){closeModal();cur=monday(dateOf(x.d));setHash();render(false);
  const el=document.querySelector('[data-k="'+x.d+"|"+x.t+'"]');if(el){setTimeout(()=>{window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-document.querySelector("header").offsetHeight-16,behavior:"smooth"});el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash")},30)}}
function plural(n,a,b,c){const m=n%10,mm=n%100;return m==1&&mm!=11?a:(m>=2&&m<=4&&(mm<12||mm>14)?b:c)}
document.getElementById("examBtn").onclick=()=>{openModal("Зачёты и экзамены");
  const groups=[];ALL.forEach(x=>{if(!EXAM_TYPES.includes(x.p))return;const g=groups[groups.length-1];
    if(g&&g.d===x.d&&g.s===x.s&&g.p===x.p)g.items.push(x);else groups.push({d:x.d,s:x.s,p:x.p,items:[x]})});
  const up=groups.filter(g=>dateOf(g.d)>=todayMid),past=groups.filter(g=>dateOf(g.d)<todayMid);
  const cnt=k=>up.filter(g=>k.includes(g.p)).length;
  let html='<div class="ex-sum"><span>Экзамены: '+cnt([9])+'</span><span>Зачёты: '+cnt([4,6,7])+'</span><span>Контрольные: '+cnt([5])+'</span></div>';
  const row=(g,i,done)=>{const dt=dateOf(g.d),days=Math.round((dt-todayMid)/864e5),x=g.items[0],last=g.items[g.items.length-1];
    const when=done?"прошло":days===0?"сегодня":days===1?"завтра":"через "+days+" "+plural(days,"день","дня","дней");
    const tm=x.t+"–"+(END[last.t]||last.t);const tch=[...new Set(g.items.map(y=>T[y.te]))].join(", ");
    return '<button class="ex-item'+(done?" done":days<=3?" soon":"")+'" data-g="'+i+'"><div class="ex-day"><b>'+dt.getDate()+"</b><small>"+MON_S[dt.getMonth()]+"</small></div><div>"+
      '<div class="ex-when">'+when+" · "+DOW[dt.getDay()]+" · "+tm+'</div><div class="subj">'+esc(S[g.s])+'</div><div class="meta"><span class="type '+PC[g.p]+'">'+esc(P[g.p])+'</span><span class="teacher">'+esc(tch)+"</span></div>"+
      (x.topic&&!/Контроль, Прием$/.test(x.topic)?'<div class="st" style="font-size:13px;color:var(--muted);margin-top:5px">'+esc(x.topic)+"</div>":"")+"</div></button>"};
  const all=up.concat(past);
  if(up.length){html+='<div class="m-sec">Впереди</div>';up.forEach(g=>html+=row(g,all.indexOf(g),false))}
  else html+='<div class="s-hint">Впереди ничего нет</div>';
  if(past.length){html+='<div class="m-sec">Прошедшие</div>';past.slice().reverse().forEach(g=>html+=row(g,all.indexOf(g),true))}
  mBody.innerHTML=html;
  mBody.querySelectorAll(".ex-item").forEach(b=>b.onclick=()=>jumpTo(all[+b.dataset.g].items[0]));
  document.getElementById("mClose").focus()};
render(true);
</script>
</body>
</html>
